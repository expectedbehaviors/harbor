# Baseline Harbor values. Override ingress host, external DB/Redis endpoints, persistence, and External Secrets item refs.

externalSecrets:
  db:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: onepassword-connect
      kind: ClusterSecretStore
    itemTitle: postgresql
    passwordProperty: password
  dockerhub:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: onepassword-connect
      kind: ClusterSecretStore
    itemTitle: dockerhub
    usernameProperty: username
    passwordProperty: password

harbor:
  expose:
    type: ingress
    tls:
      enabled: true
    ingress:
      hosts:
        core: harbor.example.com
  persistence:
    enabled: true
    persistentVolumeClaim:
      registry:
        accessMode: ReadWriteOnce
        storageClass: ""
        size: 30Gi
  database:
    type: external
    external:
      host: postgresql.example.svc.cluster.local
      port: 5432
      coreDatabase: harbor
      username: ""
      existingSecret: harbor-db
      sslmode: disable
  core:
    extraEnvVars:
      - name: POSTGRESQL_USERNAME
        valueFrom:
          secretKeyRef:
            name: harbor-db
            key: username
  redis:
    type: external
    external:
      host: redis.example.svc.cluster.local
      port: "6379"
      existingSecret: ""
  imagePullSecrets:
    - name: dockerhub
  trivy:
    enabled: true
